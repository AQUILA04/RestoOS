version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database with RLS Support
  # ---------------------------------------------------------------------------
  postgres-test:
    image: postgres:16-alpine
    container_name: restoos-postgres-test
    environment:
      POSTGRES_DB: restoos_test_db
      POSTGRES_USER: restoos_admin
      POSTGRES_PASSWORD: restoos_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoos_admin -d restoos_test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis Backplane for WebSocket & Idempotency Storage
  # ---------------------------------------------------------------------------
  redis-test:
    image: redis:7-alpine
    container_name: restoos-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Mailpit Email Server (SMTP + Web UI / REST API)
  #    - SMTP Port 1025: Receives emails sent by Spring Boot JavaMailSender
  #    - REST / Web UI Port 8025: Queried by Playwright E2E MailpitClient
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: restoos-mailpit-test
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI & REST API
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 3s
      timeout: 3s
      retries: 5

networks:
  default:
    name: restoos-test-net
