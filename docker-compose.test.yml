version: '3.8'

services:
  postgres-test:
    image: postgres:16.4-alpine
    container_name: restoos-postgres-test
    environment:
      POSTGRES_DB: restoos_test_db
      POSTGRES_USER: restoos_admin
      POSTGRES_PASSWORD: restoos_password
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-init-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoos_admin -d restoos_test_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7.2-alpine
    container_name: restoos-redis-test
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.2
    container_name: restoos-mailpit-test
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8025/api/v1/info"]
      interval: 3s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: restoos-keycloak-test
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./infra/keycloak/restoos-realm.json:/opt/keycloak/data/import/restoos-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 5s
      retries: 30

networks:
  default:
    name: restoos-test-net
