<div *ngIf="!authenticated">
  <resto-pin-lockscreen [users]="staff" (loginSuccess)="onPinLogin($event)"></resto-pin-lockscreen>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>

<div *ngIf="authenticated" class="pos-shell">
  <resto-offline-status [isOnline]="isOnline" [pendingCount]="pendingCount"></resto-offline-status>
  <div class="pos-tabs">
    <button type="button" id="tab-floor-plan" [class.active]="activeTab === 'floor'" (click)="activeTab = 'floor'">Plan de salle</button>
    <button type="button" id="tab-pos-catalog" [class.active]="activeTab === 'catalog'" (click)="activeTab = 'catalog'">Catalogue</button>
    <button type="button" id="tab-ready-orders" [class.active]="activeTab === 'ready'" (click)="activeTab = 'ready'; reloadReadyOrders()">
      À livrer
      <span class="ready-count" *ngIf="readyOrders.length">{{ readyOrders.length }}</span>
    </button>
  </div>

  <div *ngIf="activeTab === 'floor'">
    <div class="floor-actions">
      <button type="button" id="btn-order-without-table" class="secondary-btn" (click)="startOrderWithoutTable()">
        Commander sans table
      </button>
    </div>
    <resto-floor-plan
      [zones]="zones"
      [tables]="tables"
      [activeZoneId]="activeZoneId"
      (zoneSelect)="activeZoneId = $event"
      (tableSelect)="selectTable($event)">
    </resto-floor-plan>
  </div>

  <div *ngIf="activeTab === 'catalog'">
    <div class="table-context">
      <p *ngIf="selectedTable">Table {{ selectedTable.name || selectedTable.tableNumber }}
        <button type="button" class="link-btn" (click)="clearTableSelection()">Retirer</button>
      </p>
      <p *ngIf="!selectedTable" class="hint">Aucune table — optionnelle, à assigner plus tard</p>
    </div>
    <resto-pos-layout
      [categories]="categories"
      [products]="products"
      [cartItems]="cartItems"
      [activeCategoryId]="activeCategoryId"
      (categorySelect)="onCategorySelect($event)"
      (productSelect)="onProductSelect($event)"
      (checkout)="submitOrder()">
    </resto-pos-layout>
  </div>

  <div *ngIf="activeTab === 'ready'" class="ready-panel" id="ready-orders-panel">
    <h2>Commandes prêtes à livrer</h2>
    <p class="hint" *ngIf="!readyOrders.length">Aucune commande prête pour le moment.</p>
    <button
      type="button"
      class="ready-card"
      *ngFor="let order of readyOrders"
      [attr.data-order-number]="order.orderNumber"
      (click)="openReadyOrder(order)">
      <span class="ready-num">#{{ order.orderNumber }}</span>
      <span class="ready-meta">{{ tableLabel(order.tableId) }}</span>
      <span class="ready-cta">Livrer →</span>
    </button>
  </div>

  <div class="order-feedback" *ngIf="orderNumberDisplay">
    <span id="order-number-display">{{ orderNumberDisplay }}</span>
    <span class="order-status-badge">{{ orderStatus }}</span>
  </div>

  <resto-modifier-modal
    [isOpen]="modifierOpen"
    [productName]="modifierProductName"
    [modifierGroups]="modifierGroups"
    (confirm)="onModifiersConfirmed($event)"
    (dismiss)="modifierOpen = false">
  </resto-modifier-modal>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
