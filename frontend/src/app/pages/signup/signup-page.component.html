<div class="auth-shell">
  <a class="auth-brand" routerLink="/">RestoOS</a>
  <form class="auth-card" id="signup-form" (ngSubmit)="submit()">
    <h1>Créer mon espace</h1>
    <p class="auth-lead">Votre enseigne et un premier établissement sont prêts immédiatement.</p>

    <label for="org-name">Nom de l’enseigne</label>
    <input id="org-name" name="organizationName" [(ngModel)]="organizationName" required autocomplete="organization" />

    <div class="auth-row">
      <div>
        <label for="first-name">Prénom</label>
        <input id="first-name" name="firstName" [(ngModel)]="firstName" autocomplete="given-name" />
      </div>
      <div>
        <label for="last-name">Nom</label>
        <input id="last-name" name="lastName" [(ngModel)]="lastName" autocomplete="family-name" />
      </div>
    </div>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />

    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required minlength="8" autocomplete="new-password" />

    <fieldset class="auth-choice">
      <legend>Votre enseigne</legend>
      <label class="choice">
        <input type="radio" name="storeMode" value="single" [(ngModel)]="storeMode" />
        Un restaurant
      </label>
      <label class="choice">
        <input type="radio" name="storeMode" value="multi" [(ngModel)]="storeMode" />
        Plusieurs restaurants
      </label>
    </fieldset>

    <p class="auth-error" id="signup-error" *ngIf="error">{{ error }}</p>

    <button class="auth-submit" id="signup-submit" type="submit" [disabled]="submitting">
      {{ submitting ? 'Création…' : 'Ouvrir mon espace' }}
    </button>

    <p class="auth-foot">
      Déjà un compte ?
      <button type="button" class="auth-text-btn" (click)="auth.startKeycloakLogin()">Se connecter</button>
    </p>
  </form>
</div>
