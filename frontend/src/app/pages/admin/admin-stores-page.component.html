<div class="stores-page">
  <h1>Établissements</h1>
  <p class="hint">Nom, devise et fuseau horaire de chaque restaurant de l’enseigne.</p>

  <p class="ok" *ngIf="message" id="stores-message">{{ message }}</p>
  <p class="err" *ngIf="error">{{ error }}</p>

  <ul class="store-list" id="store-list">
    <li *ngFor="let store of stores" [class.active]="store.id === activeStoreId">
      <div class="fields">
        <label [attr.for]="'store-name-' + store.id">Nom</label>
        <input
          type="text"
          [id]="'store-name-' + store.id"
          [(ngModel)]="edit[store.id].name"
          [attr.aria-label]="'Nom de ' + store.name"
        />
        <label [attr.for]="'store-currency-' + store.id">Devise</label>
        <select [id]="'store-currency-' + store.id" [(ngModel)]="edit[store.id].currency">
          <option *ngFor="let c of currencies" [value]="c">{{ c }}</option>
        </select>
        <label [attr.for]="'store-tz-' + store.id">Fuseau</label>
        <input
          type="text"
          [id]="'store-tz-' + store.id"
          [(ngModel)]="edit[store.id].timezone"
          placeholder="Europe/Paris"
        />
      </div>
      <div class="actions">
        <button type="button" [attr.data-testid]="'rename-' + store.id" (click)="save(store)">
          Enregistrer
        </button>
        <button type="button" [attr.data-testid]="'select-' + store.id" (click)="selectStore(store)">
          Activer
        </button>
      </div>
    </li>
  </ul>

  <section class="add-store">
    <h2>Ajouter un restaurant</h2>
    <div class="row">
      <input
        id="new-store-name"
        type="text"
        [(ngModel)]="newStoreName"
        placeholder="Nom du restaurant"
      />
      <select id="new-store-currency" [(ngModel)]="newStoreCurrency">
        <option *ngFor="let c of currencies" [value]="c">{{ c }}</option>
      </select>
      <input
        id="new-store-timezone"
        type="text"
        [(ngModel)]="newStoreTimezone"
        placeholder="Europe/Paris"
      />
      <button type="button" id="btn-add-store" (click)="addStore()">Ajouter</button>
    </div>
  </section>
</div>
