<div class="kds-obsidian-surface kds-obsidian-grid">
  <div class="kds-cards-grid">
    <div *ngFor="let t of tickets" class="kds-card kds-ticket-card" [attr.data-order-number]="t.orderNumber">
      <div class="card-header">
        <div class="ticket-number">#{{ t.orderNumber }}</div>
        <div class="order-type-badge">{{ t.orderType }}</div>
        <div class="timer-badge" [ngClass]="getTimerTier(t.createdAt)">
          {{ getElapsedMinutes(t.createdAt) }}m
        </div>
      </div>
      <div class="cashier-line" *ngIf="t.cashierName" id="ticket-cashier-name">
        Caissier: {{ t.cashierName }}
      </div>

      <div class="card-body">
        <button
          type="button"
          *ngFor="let item of t.items; let i = index"
          class="ticket-item ticket-item-row"
          [class.item-done-strikethrough]="item.prepared"
          (click)="toggleItem(t, i); $event.stopPropagation()">
          <div class="item-qty">{{ item.quantity }}x</div>
          <div class="item-details">
            <div class="item-name">{{ item.name }}</div>
            <div *ngIf="item.modifiers?.length" class="item-mods">
              {{ item.modifiers?.join(', ') }}
            </div>
          </div>
        </button>
      </div>

      <div class="card-footer">
        <button
          type="button"
          class="status-btn"
          id="btn-ticket-ready"
          [class.status-prep]="t.status === 'PREPARING'"
          (click)="advance(t); $event.stopPropagation()">
          {{ t.status === 'SENT_TO_KITCHEN' ? 'COMMANDER EN PREPA' : 'MARQUER PRÊT' }}
        </button>
      </div>
    </div>
  </div>
</div>
