<div class="pos-layout-container" [class.cart-open]="cartOpen">
  <!-- Column 1: Categories -->
  <div class="column-categories">
    <div
      *ngFor="let c of categories"
      class="category-card"
      [class.active]="c.id === activeCategoryId"
      (click)="selectCategory(c.id)">
      {{ c.name }}
    </div>
  </div>

  <!-- Column 2: Product Grid -->
  <div class="column-products">
    <div class="products-grid">
      <div
        *ngFor="let p of products"
        class="product-card"
        [class.is-86]="p.is86"
        (click)="selectProduct(p)">
        <div class="product-title">{{ p.name }}</div>
        <div class="product-price">{{ p.price | currency:'EUR' }}</div>
        <div *ngIf="p.is86" class="badge-86">🔴 ÉPUISÉ</div>
      </div>
    </div>
  </div>

  <!-- Mobile cart toggle -->
  <button
    type="button"
    class="cart-fab"
    id="open-cart-btn"
    aria-label="Ouvrir le panier"
    (click)="cartOpen = true">
    <span class="cart-fab-label">Panier</span>
    <span class="cart-fab-count" *ngIf="cartItems.length">{{ cartItemCount }}</span>
    <span class="cart-fab-total">{{ cartTotal | currency:'EUR' }}</span>
  </button>

  <div
    class="cart-backdrop"
    *ngIf="cartOpen"
    (click)="cartOpen = false"
    aria-hidden="true"></div>

  <!-- Column 3: Active Cart -->
  <aside class="column-cart" [class.open]="cartOpen" aria-label="Commande active">
    <div class="cart-header">
      <h2>Commande Active</h2>
      <button
        type="button"
        class="cart-close-btn"
        aria-label="Fermer le panier"
        (click)="cartOpen = false">
        ✕
      </button>
    </div>
    <div class="cart-items-list">
      <div *ngFor="let item of cartItems" class="cart-item-row">
        <div class="item-info">
          <div class="item-name">{{ item.quantity }}x {{ item.name }}</div>
          <div *ngIf="item.modifiers.length" class="item-mods">{{ item.modifiers.join(', ') }}</div>
        </div>
        <div class="item-total">{{ (item.unitPrice * item.quantity) | currency:'EUR' }}</div>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>TOTAL</span>
        <span class="total-amount" id="cart-total-amount">{{ cartTotal | currency:'EUR' }}</span>
      </div>
      <button
        type="button"
        class="checkout-btn"
        id="submit-order-btn"
        [disabled]="!cartItems.length"
        (click)="onCheckout()">
        ENVOYER EN CUISINE
      </button>
    </div>
  </aside>
</div>
