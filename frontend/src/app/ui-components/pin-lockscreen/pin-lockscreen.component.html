<div class="lockscreen-container">
  <div class="user-cards">
    <div
      *ngFor="let u of users"
      class="user-card"
      data-testid="user-card"
      [class.active]="u.id === selectedUserId"
      (click)="selectUser(u.id)"
      (keydown.enter)="selectUser(u.id)"
      tabindex="0"
      role="button"
      [attr.aria-label]="'Sélectionner ' + u.name">
      <div class="avatar">{{ u.name.substring(0, 2).toUpperCase() }}</div>
      <div class="user-name">{{ u.name }}</div>
    </div>
  </div>

  <div class="numpad-container pin-numpad">
    <div class="pin-display" id="pin-display">{{ pinMask }}</div>

    <div class="numpad-grid">
      <button
        *ngFor="let digit of ['1','2','3','4','5','6','7','8','9']"
        type="button"
        class="pin-button"
        [attr.data-digit]="digit"
        (click)="pressDigit(digit)">
        {{ digit }}
      </button>
      <button type="button" class="pin-button action" (click)="clearPin()">C</button>
      <button type="button" class="pin-button" data-digit="0" (click)="pressDigit('0')">0</button>
      <button type="button" class="pin-button action" (click)="submitPin()">✓</button>
    </div>
  </div>
</div>
