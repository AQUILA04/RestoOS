name: RestoOS CI/CD Quality Pipeline

on:
  push:
    branches: [ main, develop, cursor/** ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: 1. Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Unit tests
        run: |
          cd backend
          mvn -B clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn

  integration-tests:
    name: 2. Integration Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Start containers
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Failsafe IT
        run: |
          cd backend
          mvn -B verify -DskipTests=false
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/restoos_test_db
          SPRING_DATASOURCE_USERNAME: restoos_app
          SPRING_DATASOURCE_PASSWORD: restoos_app_pass
          SPRING_LIQUIBASE_USER: restoos_admin
          SPRING_LIQUIBASE_PASSWORD: restoos_password
          RESTOOS_JWT_SECRET: e2e-secret-key-which-is-long-enough-123456
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 1025
          SPRING_REDIS_HOST: localhost
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-integration-reports
          path: backend/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: warn

  frontend-build:
    name: 3. Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm ci
          npm run build

  e2e-tests:
    name: 4. Playwright Golden Path E2E
    needs: [integration-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start infra
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Package backend
        run: |
          cd backend
          mvn -B clean package -DskipTests

      - name: Launch backend (e2e profile)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/restoos_test_db
          SPRING_DATASOURCE_USERNAME: restoos_app
          SPRING_DATASOURCE_PASSWORD: restoos_app_pass
          SPRING_LIQUIBASE_USER: restoos_admin
          SPRING_LIQUIBASE_PASSWORD: restoos_password
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: 1025
          SPRING_REDIS_HOST: localhost
          RESTOOS_JWT_SECRET: e2e-secret-key-which-is-long-enough-123456
          RESTOOS_ISSUER_URI: ''
          RESTOOS_FRONTEND_BASE_URL: http://localhost:4200
        run: |
          java -jar backend/target/resto-os-backend-0.0.1-SNAPSHOT.jar \
            --spring.profiles.active=e2e > backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend UP"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed"; cat backend.log; exit 1

      - name: Install frontend & Playwright
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build & serve frontend
        run: |
          cd frontend
          npm run build -- --configuration=development
          npx http-server dist/restoos-shell/browser -p 4200 -c-1 > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "Frontend UP"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed"; cat frontend.log; exit 1

      - name: Golden path E2E
        env:
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080
          RESTOOS_JWT_SECRET: e2e-secret-key-which-is-long-enough-123456
        run: |
          cd frontend
          npm run test:e2e -- --retries=0

      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-e2e-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            frontend/frontend.log
          retention-days: 14
          if-no-files-found: warn
